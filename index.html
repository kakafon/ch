<title>Minervini Screener &mdash; Norden</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
:root{--bg:#060b14;--bg2:#0d1520;--bg3:#0a1018;--bdr:#1a2535;--bdr2:#0d1a2d;--txt:#e2e8f0;--txt2:#94a3b8;--txt3:#475569;--txt4:#2d3f55;--acc:#3b82f6;--acc-bg:rgba(59,130,246,0.08);--inp:#0d1520;--inp-bdr:#1e3a5f;}
body.light{--bg:#f8fafc;--bg2:#ffffff;--bg3:#f1f5f9;--bdr:#e2e8f0;--bdr2:#e2e8f0;--txt:#0f172a;--txt2:#334155;--txt3:#64748b;--txt4:#94a3b8;--acc:#2563eb;--acc-bg:rgba(37,99,235,0.07);--inp:#ffffff;--inp-bdr:#cbd5e1;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'IBM Plex Mono',monospace;background:var(--bg);color:var(--txt);min-height:100vh;transition:background .2s,color .2s;font-size:13px;}
::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px;}
input,textarea,select,button{font-family:inherit;font-size:13px;outline:none;}a{color:var(--acc);}
.hdr{border-bottom:1px solid var(--bdr2);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:10;}
.hdr-title{font-size:19px;font-weight:700;color:var(--txt);letter-spacing:-.02em;}
.hdr-sub{font-size:9px;color:var(--txt4);letter-spacing:.25em;margin-bottom:2px;}
.main{padding:18px 22px;}
.tab-bar{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--bdr2);padding-bottom:12px;flex-wrap:wrap;}
.tab{background:transparent;border:1px solid var(--bdr);border-radius:6px;color:var(--txt3);padding:6px 14px;font-size:11px;cursor:pointer;transition:all .15s;}
.tab.active{background:var(--acc);border-color:var(--acc);color:#fff;}
.tab:hover:not(.active){border-color:var(--acc);color:var(--txt);}
.info-box{background:var(--bg2);border:1px solid var(--inp-bdr);border-radius:8px;padding:14px;font-size:12px;color:var(--txt3);line-height:1.8;margin-bottom:14px;}
.field-lbl{font-size:11px;color:var(--txt3);margin-bottom:4px;}
.field-hint{font-size:10px;color:var(--txt4);margin-top:-6px;margin-bottom:8px;}
input[type=text],input[type=url]{width:100%;background:var(--inp);border:1px solid var(--inp-bdr);border-radius:6px;color:var(--txt);padding:9px 12px;font-size:12px;margin-bottom:10px;transition:border-color .15s;}
input[type=text]:focus,input[type=url]:focus{border-color:var(--acc);}
input[type=text].inp-highlight{border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.04);}
textarea{width:100%;background:var(--inp);border:1px solid var(--inp-bdr);border-radius:8px;color:var(--txt);padding:10px;font-size:11px;resize:vertical;margin-bottom:10px;line-height:1.5;}
textarea:focus{border-color:var(--acc);}
.btn{background:var(--acc);color:#fff;border:none;border-radius:6px;padding:9px 24px;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s;}
.btn:disabled{opacity:.4;cursor:default;}.btn:hover:not(:disabled){opacity:.88;}
.btn-ghost{background:transparent;border:1px solid var(--bdr);border-radius:5px;color:var(--txt3);padding:5px 12px;font-size:11px;cursor:pointer;transition:all .12s;}
.btn-ghost:hover{border-color:var(--acc);color:var(--txt);}
.btn-green{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:5px;color:#10b981;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;}
.btn-red{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:5px;color:#f87171;padding:5px 10px;font-size:11px;cursor:pointer;}
.ctrl-btn{background:transparent;border:1px solid var(--bdr);border-radius:5px;color:var(--txt3);padding:4px 10px;font-size:11px;cursor:pointer;transition:all .12s;}
.ctrl-btn.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.ctrl-btn:hover:not(.on){border-color:var(--acc);color:var(--txt);}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:6px;padding:10px 14px;margin-bottom:10px;font-size:12px;color:#f87171;}
.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:6px;padding:10px 14px;margin-bottom:10px;font-size:12px;color:#22c55e;}
table{width:100%;border-collapse:collapse;}
thead th{padding:8px 12px;font-size:9px;color:var(--txt4);letter-spacing:.15em;text-transform:uppercase;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--bdr2);}
th.r{text-align:right;}th.c{text-align:center;}
td{padding:9px 12px;border-bottom:1px solid var(--bdr2);vertical-align:middle;}
tbody tr{cursor:pointer;transition:background .1s;}tbody tr:hover{background:rgba(59,130,246,.06)!important;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--bg2);border:1px solid var(--bdr);border-radius:12px;padding:26px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.sec-lbl{font-size:9px;color:var(--txt4);letter-spacing:.15em;text-transform:uppercase;font-weight:600;margin-bottom:7px;}
.drow{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
.dk{color:var(--txt3);}.dv{color:var(--txt2);font-variant-numeric:tabular-nums;}
.badge{font-size:9px;padding:2px 5px;border-radius:3px;font-weight:700;display:inline-block;}
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;}
.ring-in{width:32px;height:32px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;}
.guide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--bdr2);}
.guide-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;padding:12px;}
.g-title{font-size:11px;font-weight:700;color:var(--acc);margin-bottom:5px;}
.g-text{font-size:11px;color:var(--txt3);line-height:1.7;}
/* ── Posisjon-kort ────────────────────────────────────── */
.pos-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;padding:14px;margin-bottom:10px;}
.pos-ticker{font-size:16px;font-weight:700;color:var(--txt);}
.pos-name{font-size:11px;color:var(--txt3);}
.target-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bdr2);font-size:12px;}
.target-row:last-child{border-bottom:none;}
.tgt-hit{background:rgba(34,197,94,.15);border-radius:3px;padding:2px 6px;color:#22c55e;font-size:10px;font-weight:700;cursor:pointer;}
.tgt-open{background:rgba(30,42,60,.5);border-radius:3px;padding:2px 6px;color:var(--txt3);font-size:10px;cursor:pointer;}
.bors-bar{display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap;}
/* ── Edit-panel inne i posisjonskort ─────────────────── */
.edit-panel{background:var(--bg3);border:1px solid var(--bdr);border-radius:6px;padding:12px;margin-bottom:12px;}
.edit-panel-title{font-size:9px;color:var(--txt4);letter-spacing:.15em;text-transform:uppercase;font-weight:600;margin-bottom:10px;}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.edit-field label{display:block;font-size:10px;color:var(--txt3);margin-bottom:3px;}
.edit-field input{width:100%;background:var(--inp);border:1px solid var(--inp-bdr);border-radius:5px;color:var(--txt);padding:7px 10px;font-size:12px;transition:border-color .15s;}
.edit-field input:focus{border-color:var(--acc);}
.edit-note{font-size:10px;color:var(--txt4);margin-bottom:8px;line-height:1.5;}
/* ── Kalkulator: inngangsfelt highlight ───────────────── */
.kalk-inngang-wrap{position:relative;margin-bottom:10px;}
.kalk-inngang-wrap .badge-lastprice{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:9px;background:rgba(59,130,246,.15);color:var(--acc);border:1px solid rgba(59,130,246,.3);border-radius:3px;padding:2px 5px;pointer-events:none;}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useMemo,useCallback,useEffect,useRef}=React;
const h=React.createElement;
const LS={
  get:(k,fb)=>{try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):fb;}catch{return fb;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
};

const EXCHANGES=[
  {id:'OSL',navn:'Oslo',      flag:'\uD83C\uDDF3\uD83C\uDDF4',suffix:'.OL',tv:'OSLO',   valuta:'NOK'},
  {id:'STO',navn:'Stockholm', flag:'\uD83C\uDDF8\uD83C\uDDEA',suffix:'.ST',tv:'OMXSTO', valuta:'SEK'},
  {id:'CPH',navn:'K\u00F8benhavn',flag:'\uD83C\uDDE9\uD83C\uDDF0',suffix:'.CO',tv:'OMXCOP',valuta:'DKK'},
  {id:'HEL',navn:'Helsinki',  flag:'\uD83C\uDDEB\uD83C\uDDEE',suffix:'.HE',tv:'OMXHEX', valuta:'EUR'},
];

const GLOSS=[
  {t:'Trend Template (TT)',c:'Minervinis 8 tekniske krav. Aksjen m\u00E5 handles over MA50, MA150 og MA200. MA-ene m\u00E5 v\u00E6re sortert riktig (50>150>200). MA200 skal stige. Kursen skal v\u00E6re innen 25% av 52-ukers h\u00F8y. RS-score \u226570. Jo flere krav (score 0-8), jo sterkere teknisk oppsett.'},
  {t:'VCP \u2014 Volatility Contraction Pattern',c:'Minervinis viktigste m\u00F8nster. Kursen konsoliderer i 3-4 faser med SYNKENDE volatilitet og SYNKENDE volum. F.eks: \u221220% \u2192 \u221212% \u2192 \u22127% \u2192 \u22124%. Hvert h\u00E5ndtak er smalere. Volumet t\u00F8rker inn. Utbrudd skjer p\u00E5 h\u00F8yt volum. Jo smalere siste kontraksjon, jo lavere risiko.'},
  {t:'Pivot Point',c:'Den \u00F8verste motstandssonen i siste kontraksjon av et VCP-m\u00F8nster. Entry er et brudd over dette niv\u00E5et p\u00E5 klart h\u00F8yere volum enn normalt (minst 40-50% over 50-dagers gjennomsnittsvolum). Kj\u00F8p IKKE under pivoten.'},
  {t:'RS Score (Relativ Styrke)',c:'IBD-inspirert beregning. Sammenligner aksjes vektede avkastning siste 12 mnd mot nasjonal indeks. Score 1-99. Over 70 er bra, over 80 er sterkt. Minervini vil ha RS \u226570 F\u00D8R utbruddet. RS-linjen b\u00F8r ideelt n\u00E5 nye h\u00F8yder f\u00F8r kursen gj\u00F8r det.'},
  {t:'Distribusjon',c:'Institusjonell salgsaktivitet. Kjennetegn: kursfall p\u00E5 H\u00D8YERE enn normalt volum, spesielt etter en oppgang. 3-5 distribusjonsdager p\u00E5 en indeks over 4-5 uker er bearish signal. P\u00E5 enkeltaksje: store r\u00F8de staker med h\u00F8yt volum etter oppgang = advarsel.'},
  {t:'SEPA (Specific Entry Point Analysis)',c:'Minervinis rammeverk. Kombinerer: Trend (teknikk), Fundamentalt (EPS/Rev vekst >20%/15%, ROE >17%), Sentiment (institusjonell eierskap), og Katalysator (noe som kan drive kursen). Alle fire b\u00F8r peke samme vei.'},
  {t:'Stop-loss',c:'Festes 7-8% under inngangspris (eller under pivot-niv\u00E5). Flyttes ALDRI ned. Aksept\u00E9r tapet og kom deg ut. Minervini: "Cut losses and let profits run." En stop er ikke feil \u2014 det er risikostyring.'},
  {t:'Posisjonst\u00F8rrelse',c:'Maks 1-2% av total konto i risiko per trade. Formel: (Konto \u00D7 1%) \u00F7 (Inngang \u2212 Stop) = Antall aksjer. Med 100k konto og 1% risiko: 1000 kr risiko. Stop 8% under 100 kr inngang = 8 kr risiko/aksje \u2192 kj\u00F8p 125 aksjer.'},
  {t:'2:1, 3:1, 4:1 Targets',c:'Risk/reward-m\u00E5l. Hvis risiko er 8 kr per aksje er 2:1 = +16 kr, 3:1 = +24 kr, 4:1 = +32 kr over inngang. Minervini tar gjerne delvis gevinst ved 20-25% oppgang og lar resten l\u00F8pe. Minste akseptable R/R er 3:1.'},
  {t:'Trailing Stop',c:'Etter 20-25% oppgang: flytt stop til breakeven. Etter 30%+: bruk MA50 som trailing stop. La vinnerne l\u00F8pe til teknisk brudd. Ikke selg for tidlig p.g.a. frykt \u2014 det er den vanligste feilen.'},
];

const SMC_GLOSS=[
  {g:'Struktur',items:[
    {t:'Market Structure',c:'Den overordnede retningen markedet beveger seg i, lest ut fra rekkef\u00F8lgen av swing-topper og swing-bunner. Stigende struktur = h\u00F8yere topper og h\u00F8yere bunner (HH/HL). Fallende struktur = lavere topper og lavere bunner (LH/LL).'},
    {t:'Swing High / Swing Low',c:'Et lokalt topp- eller bunnpunkt p\u00E5 kursgrafen, definert av at kursen snur retning rundt punktet. Grunnbyggesteinen i all strukturanalyse \u2014 BOS og CHoCH m\u00E5les alltid mot forrige swing-punkt.'},
    {t:'BOS \u2014 Break of Structure',c:'Kursen bryter gjennom forrige swing-punkt I SAMME RETNING som trenden. Bekrefter at trenden fortsetter. I en oppgang: brudd over forrige swing high. I en nedgang: brudd under forrige swing low.'},
    {t:'CHoCH \u2014 Change of Character',c:'Det f\u00F8rste tegnet p\u00E5 at trenden kan v\u00E6re i ferd med \u00E5 snu. Kursen bryter gjennom et swing-punkt MOT den etablerte trenden \u2014 f.eks. bryter under siste highere low i en oppgang. Dette er ofte det tidligste varselet om en topp eller bunn, og n\u00F8kkelsignalet man leter etter n\u00E5r man skal time reverseringer.'},
    {t:'Internal Structure vs. Swing Structure',c:'Lux Algo (og SMC generelt) skiller mellom "swing"-struktur (de store, \u00E5penbare topp/bunn-punktene p\u00E5 grafen) og "internal"-struktur (mindre svingninger inni en st\u00F8rre bevegelse, sett p\u00E5 lavere tidsramme). Internal BOS/CHoCH gir tidligere, men mer st\u00F8yete signaler enn swing BOS/CHoCH.'},
    {t:'Strong High / Strong Low',c:'Et swing-punkt som IKKE er tatt ut igjen \u2014 markedet har respektert niv\u00E5et. Regnes som et p\u00E5litelig m\u00E5l for fremtidig likviditet fordi det trolig fortsatt ligger stop-ordre/likviditet der.'},
    {t:'Weak High / Weak Low',c:'Et swing-punkt som allerede er tatt ut (sveipet), altså et niv\u00E5 markedet har "renset". Mindre interessant som m\u00E5l fremover fordi likviditeten der trolig allerede er hentet.'},
  ]},
  {g:'Likviditet',items:[
    {t:'Liquidity (BSL / SSL)',c:'Buy-Side Liquidity (BSL) er stop-loss-ordre fra shortere som ligger over tidligere topper. Sell-Side Liquidity (SSL) er stop-loss fra long-posisjoner som ligger under tidligere bunner. Store aktører trenger denne likviditeten for \u00E5 fylle store ordre, og priser trekkes derfor ofte MOT disse niv\u00E5ene f\u00F8r reell reversering.'},
    {t:'Liquidity Sweep / Stop Hunt',c:'Kursen stikker kortvarig gjennom et \u00E5penbart niv\u00E5 (f.eks. en tidligere bunn) for \u00E5 utl\u00F8se stop-ordre, f\u00F8r den reverserer tilbake i motsatt retning. Klassisk SMC-signal for \u00E5 identifisere en falsk bevegelse f\u00F8r ekte reversering \u2014 sentralt for \u00E5 finne bunner/topper.'},
    {t:'Equal Highs / Equal Lows (EQH / EQL)',c:'To eller flere topper (EQH) eller bunner (EQL) p\u00E5 tilnærmet samme niv\u00E5. Dette bygger opp en tydelig likviditetspool som markedet ofte er tiltrukket av \u00E5 sveipe f\u00F8r en st\u00F8rre bevegelse.'},
    {t:'Inducement (IDM)',c:'Et mindre, "lokkende" swing-punkt plassert mellom entry og et st\u00F8rre likviditetsniv\u00E5, designet for \u00E5 lure tidlige tradere inn i posisjon f\u00F8r den egentlige bevegelsen skjer. Sveip av inducement bekrefter ofte at et order block er gyldig.'},
  ]},
  {g:'Soner / Points of Interest',items:[
    {t:'Order Block (OB)',c:'Det siste motsatte candle-settet f\u00F8r en kraftig, retningsbestemt bevegelse (displacement). Bullish OB = siste r\u00F8de candle f\u00F8r stort opptrekk. Bearish OB = siste gr\u00F8nne candle f\u00F8r stort fall. Tolkes som stedet hvor institusjoner \u00E5pnet posisjoner, og brukes som entry-sone n\u00E5r kursen kommer tilbake ("mitigation").'},
    {t:'Breaker Block',c:'Et order block som har feilet \u2014 kursen brøt gjennom det \u2014 og deretter snudde rollen sin: en tidligere bearish OB som blir brutt og retestet nedenfra fungerer som ny support (og omvendt). Sees som et sterkere signal enn et vanlig OB fordi det bekrefter en strukturell endring.'},
    {t:'Fair Value Gap (FVG) / Imbalance',c:'Et "hull" i prisstrukturen der kursen beveget seg s\u00E5 raskt at det ikke ble reell to-veis handel \u2014 vises som gapet mellom candle 1 sin høy/lav og candle 3 sin lav/høy, med candle 2 (den store) i midten. Markedet har en tendens til \u00E5 "fylle" (mitigere) disse gapene senere, og de brukes ofte som entry- eller m\u00E5lsoner.'},
    {t:'Mitigation',c:'Når kursen returnerer til et order block eller en FVG og "fyller" eller reagerer p\u00E5 sonen. Et OB/FVG regnes som mitigert n\u00E5r prisen har handlet gjennom det \u2014 etter det kan sonen miste sin gyldighet som fremtidig entry.'},
    {t:'Supply Zone / Demand Zone',c:'Bredere soner (ofte flere candles) hvor tilbud eller etterspørsel tidligere har overveldet markedet og snudd prisen. Overlapper konseptuelt med order blocks, men er gjerne bredere og mindre presise \u2014 nyttige som kontekst rundt et OB.'},
    {t:'Point of Interest (POI)',c:'Samlebetegnelse for et hvilket som helst niv\u00E5 SMC-traderen vurderer som viktig for en fremtidig reaksjon: order block, FVG, breaker, liquidity pool osv. Når flere POI-er faller sammen (confluence) styrkes signalet.'},
  ]},

function parseRows(rows){
  return rows.map(r=>{
    const n=k=>{const v=parseFloat(String(r[k]||'').replace(/\u26A0/g,'').trim());return isNaN(v)?null:v;};
    const s=k=>String(r[k]||'').trim();
    const ticker=s('Ticker');if(!ticker||ticker.length<2)return null;
    return{ticker,name:s('Navn'),price:n('Kurs'),high52:n('52w H\u00F8y'),low52:n('52w Lav'),
      avgVol:n('Avg.Vol(50d)'),ma50:n('MA50'),ma150:n('MA150'),ma200:n('MA200'),
      ttScore:n('TT Score (0-8)')||0,rsScore:n('RS Score (1-99)'),
      niVekst:n('NI-vekst YoY %'),revVekst:n('Omsetn.vekst YoY %'),
      roe:n('ROE %'),netMarg:n('Nettomarg. %'),
      sepaEps:s('SEPA: NI\u226520%'),sepaRev:s('SEPA: Rev\u226515%'),
      sepaRoe:s('SEPA: ROE\u226517%'),sepaMarg:s('SEPA: Marg.\u2191'),
      fundScore:n('Fund Score (0-4)')||0,total:n('Total Score (0-12)')||0,
      updated:s('Oppdatert'),
      tt:['TT1: Pris>MA50','TT2: Pris>MA150','TT3: Pris>MA200',
          'TT4: MA50>MA150','TT5: MA150>MA200','TT6: MA200\u2191','TT7: \u226525% fra topp'].map(k=>s(k)),
      vcpScore:(()=>{const v=n('VCP Score (0-10)');return(v!=null&&v>=0&&v<=10)?v:null;})(),
      vcpDetaljer:s('VCP Detaljer'),
    };
  }).filter(Boolean);
}

// ─── Beregner alle avledede verdier for en posisjon ──────────────────────────
// nyInngang: overstyr inngangskurs
// nyAntall:  overstyr antall aksjer direkte (skippar riskKr-beregning)
function beregnPos(p, nyInngang, nyAntall) {
  const inn  = nyInngang != null ? nyInngang : p.inngang;
  const stop = +(inn * (1 - p.sPst / 100)).toFixed(2);

  let antall, riskKr;
  if (nyAntall != null) {
    // Manuelt antall — riskKr oppdateres til faktisk risiko
    antall  = nyAntall;
    riskKr  = inn > stop ? +(antall * (inn - stop)).toFixed(0) : 0;
  } else {
    // Beregnes fra risikoprosent (standard)
    riskKr  = p.riskKr;
    antall  = inn > stop ? Math.floor(riskKr / (inn - stop)) : p.antall;
  }

  const totInv = +(antall * inn).toFixed(0);
  return {
    ...p, inngang: inn, stop, antall, totInv, riskKr,
    t2: +(inn * (1 + p.sPst * 2 / 100)).toFixed(2),
    t3: +(inn * (1 + p.sPst * 3 / 100)).toFixed(2),
    t4: +(inn * (1 + p.sPst * 4 / 100)).toFixed(2),
  };
}

// ─── Kalkulator-modal ────────────────────────────────────────────────────────
function Kalkulator({aksje, onClose, onKjopt}) {
  const [konto, setKonto]       = useState(() => LS.get('kalk_konto',  '100000'));
  const [rPst,  setRPst]        = useState(() => LS.get('kalk_risiko', '1'));
  const [sPst,  setSPst]        = useState(() => LS.get('kalk_stop',   '8'));
  const [dato,  setDato]        = useState(new Date().toISOString().split('T')[0]);

  // Inngangskurs: forhåndsutfylt med siste sluttkurs, men redigerbar
  const lastPrice = aksje.price || 0;
  const [inngKurs, setInngKurs] = useState(String(lastPrice > 0 ? lastPrice : ''));
  const inngChanged = parseFloat(inngKurs.replace(',','.')) !== lastPrice;

  useEffect(() => {
    LS.set('kalk_konto', konto);
    LS.set('kalk_risiko', rPst);
    LS.set('kalk_stop', sPst);
  }, [konto, rPst, sPst]);

  const kR  = parseFloat(konto)  || 0;
  const rP  = parseFloat(rPst)   || 1;
  const sP  = parseFloat(sPst)   || 8;
  const inn = parseFloat(inngKurs.replace(',','.')) || lastPrice || 0;

  const stop   = +(inn * (1 - sP / 100)).toFixed(2);
  const riskKr = +(kR * (rP / 100)).toFixed(0);
  const antall = inn > stop ? Math.floor(riskKr / (inn - stop)) : 0;
  const totInv = +(antall * inn).toFixed(0);
  const t2 = +(inn * (1 + sP * 2 / 100)).toFixed(2);
  const t3 = +(inn * (1 + sP * 3 / 100)).toFixed(2);
  const t4 = +(inn * (1 + sP * 4 / 100)).toFixed(2);

  const fld = (lbl, val, set, opts={}) => h('div', {key: lbl, style:{marginBottom:10}},
    h('div', {className:'field-lbl'}, lbl),
    opts.hint ? h('div', {className:'field-hint'}, opts.hint) : null,
    h('input', {
      type:'text', value:val,
      onChange: e => set(e.target.value),
      className: opts.highlight ? 'inp-highlight' : '',
      style:{background:'var(--inp)',border:'1px solid var(--inp-bdr)',borderRadius:6,
             color:'var(--txt)',padding:'8px 12px',width:'100%',
             ...(opts.highlight ? {borderColor:'rgba(59,130,246,.6)',background:'rgba(59,130,246,.04)'} : {})}
    })
  );

  const row = (lbl, val, hi, muted) => h('div', {className:'drow', style: hi ? {fontWeight:700} : {}},
    h('span', {className:'dk'}, lbl),
    h('span', {className:'dv', style: hi ? {color:'#22c55e'} : muted ? {color:'var(--txt4)'} : {}}, val)
  );

  const doKjopt = () => {
    if (!inn || inn <= 0) return;
    const pos = {
      id: Date.now(), ticker: aksje.ticker, name: aksje.name,
      inngang: inn, stop, antall, totInv, riskKr, rPst: rP, sPst: sP, dato,
      t2, t3, t4, hitT2: false, hitT3: false, hitT4: false, hitStop: false,
    };
    LS.set('posisjoner', [...LS.get('posisjoner', []), pos]);
    onKjopt && onKjopt();
    onClose();
  };

  const sym = aksje.ticker.replace(/\.(OL|ST|CO|HE)$/, '');

  return h('div', {className:'modal-bg', onClick:onClose},
    h('div', {className:'modal', onClick:e=>e.stopPropagation()},

      // Header
      h('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:18}},
        h('div', null,
          h('div', {style:{fontSize:18,fontWeight:700,color:'var(--txt)'}}, sym),
          h('div', {style:{fontSize:11,color:'var(--txt3)'}}, aksje.name),
        ),
        h('button', {style:{background:'none',border:'none',color:'var(--txt3)',fontSize:22,cursor:'pointer'},onClick:onClose}, '\u2715')
      ),

      // ── Inngangskurs (ny, redigerbar) ──
      h('div', {style:{marginBottom:10}},
        h('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:4}},
          h('div', {className:'field-lbl'}, 'Inngangskurs'),
          lastPrice > 0
            ? h('span', {
                style:{fontSize:10,color: inngChanged ? '#f97316' : 'var(--acc)',cursor:'pointer',
                       background: inngChanged ? 'rgba(249,115,22,.1)' : 'var(--acc-bg)',
                       border:`1px solid ${inngChanged ? 'rgba(249,115,22,.3)' : 'var(--acc)'}`,
                       borderRadius:3, padding:'1px 6px'},
                onClick: () => setInngKurs(String(lastPrice)),
              }, inngChanged ? '\u21BA tilbakestill til ' + lastPrice.toFixed(2) : 'Siste kurs: ' + lastPrice.toFixed(2))
            : null,
        ),
        h('input', {
          type:'text', value:inngKurs,
          onChange: e => setInngKurs(e.target.value),
          style:{background:'var(--inp)',border:`1px solid ${inngChanged?'#f97316':'rgba(59,130,246,.5)'}`,
                 borderRadius:6,color:'var(--txt)',padding:'9px 12px',width:'100%',
                 background: inngChanged ? 'rgba(249,115,22,.04)' : 'rgba(59,130,246,.04)'},
          placeholder:'Skriv inn \u00F8nsket kurs (f.eks. pivot)'
        }),
        inngChanged
          ? h('div', {style:{fontSize:10,color:'#f97316',marginTop:-6,marginBottom:8}},
              '\u26A0 Avviker fra siste kurs (' + lastPrice.toFixed(2) + ')')
          : h('div', {style:{fontSize:10,color:'var(--txt4)',marginTop:-6,marginBottom:8}},
              'Juster til planlagt pivot dersom over siste kurs'),
      ),

      // Divider
      h('div', {style:{borderTop:'1px solid var(--bdr2)',margin:'4px 0 12px'}}),

      // Kontoinnstillinger
      fld('Kontobalanse', konto, setKonto),
      fld('Risiko (%)', rPst, setRPst),
      fld('Stop-loss (%)', sPst, setSPst),
      fld('Dato', dato, setDato),

      // Resultat-boks
      h('div', {style:{background:'var(--bg3)',borderRadius:8,padding:14,marginBottom:16}},
        h('div', {className:'sec-lbl', style:{marginBottom:8}}, 'Beregnet posisjon'),
        row('Inngangskurs', inn.toFixed(2)),
        row('Stop-kurs', stop.toFixed(2) + ' (\u2212' + sP + '%)'),
        row('Risiko kr', riskKr.toLocaleString('nb-NO') + ' (' + rP + '%)'),
        row('Antall aksjer', antall.toLocaleString('nb-NO')),
        row('Total investering', totInv.toLocaleString('nb-NO')),
        h('div', {style:{borderTop:'1px solid var(--bdr2)',margin:'8px 0'}}),
        row('Target 2:1 (+' + (sP*2).toFixed(0) + '%)', t2.toFixed(2)),
        row('Target 3:1 (+' + (sP*3).toFixed(0) + '%)', t3.toFixed(2)),
        row('Target 4:1 (+' + (sP*4).toFixed(0) + '%)', t4.toFixed(2), true),
      ),

      // Knapper
      h('div', {style:{display:'flex',gap:8}},
        h('button', {
          className:'btn', style:{background:'#16a34a', opacity: inn>0?1:.4},
          disabled: inn<=0,
          onClick: doKjopt,
        }, '\u2713 Registrer kj\u00F8p'),
        h('button', {className:'btn-ghost', onClick:onClose}, 'Avbryt'),
      ),
    )
  );
}

// ─── Posisjonskort ────────────────────────────────────────────────────────────
function PosKort({p, onToggle, onFjern, onOppdater}) {
  const [red, setRed]         = useState(false);
  const [tmpInn, setTmpInn]   = useState(String(p.inngang));
  const [tmpAnt, setTmpAnt]   = useState(String(p.antall));

  // Forhåndsvis beregnet stop/targets basert på felt under redigering
  const prevInn = parseFloat(tmpInn.replace(',','.'));
  const prevAnt = parseInt(tmpAnt, 10);
  const innOK   = !isNaN(prevInn) && prevInn > 0;
  const antOK   = !isNaN(prevAnt) && prevAnt > 0;

  // Live preview av hva som vil lagres
  const preview = useMemo(() => {
    if (!innOK) return null;
    const inn  = prevInn;
    const stop = +(inn * (1 - p.sPst / 100)).toFixed(2);
    const ant  = antOK ? prevAnt : Math.floor(p.riskKr / (inn - stop));
    return {
      stop,
      antall:  ant,
      totInv:  +(ant * inn).toFixed(0),
      riskKr:  antOK ? +(ant * (inn - stop)).toFixed(0) : p.riskKr,
      t2: +(inn * (1 + p.sPst * 2 / 100)).toFixed(2),
      t3: +(inn * (1 + p.sPst * 3 / 100)).toFixed(2),
      t4: +(inn * (1 + p.sPst * 4 / 100)).toFixed(2),
    };
  }, [tmpInn, tmpAnt, p.sPst, p.riskKr]);

  const lagre = () => {
    const nyInn = innOK ? prevInn : null;
    const nyAnt = antOK && prevAnt !== p.antall ? prevAnt : null;
    if (nyInn !== null || nyAnt !== null) {
      onOppdater(p.id, nyInn, nyAnt);
    }
    setRed(false);
  };

  const avbryt = () => {
    setTmpInn(String(p.inngang));
    setTmpAnt(String(p.antall));
    setRed(false);
  };

  const cap = f => f.charAt(0).toUpperCase() + f.slice(1);

  return h('div', {className:'pos-card'},
    // Header
    h('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}},
      h('div', null,
        h('span', {className:'pos-ticker'}, p.ticker.replace(/\.(OL|ST|CO|HE)$/, ''), ' '),
        h('span', {className:'pos-name'}, p.name),
        h('div', {style:{fontSize:11,color:'var(--txt4)',marginTop:2}},
          p.dato + ' \u00B7 ' + p.antall + ' aksjer \u00B7 ' + p.totInv.toLocaleString('nb-NO')),
      ),
      h('div', {style:{display:'flex',gap:6}},
        h('button', {
          className: 'btn-ghost',
          style:{fontSize:10,padding:'3px 8px', ...(red?{borderColor:'var(--acc)',color:'var(--acc)'}:{})},
          onClick: () => red ? avbryt() : setRed(true),
        }, red ? 'Avbryt' : '\u270F\uFE0F Juster'),
        h('button', {className:'btn-red', onClick:()=>onFjern(p.id)}, '\u2715'),
      ),
    ),

    // ── Redigeringspanel ──
    red && h('div', {className:'edit-panel'},
      h('div', {className:'edit-panel-title'}, 'Juster posisjon'),
      h('div', {className:'edit-grid'},
        // Inngangskurs
        h('div', {className:'edit-field'},
          h('label', null, 'Inngangskurs'),
          h('input', {
            type:'text', value:tmpInn,
            onChange: e => setTmpInn(e.target.value),
            onKeyDown: e => e.key==='Enter' && lagre(),
          }),
        ),
        // Antall aksjer
        h('div', {className:'edit-field'},
          h('label', null, 'Antall aksjer'),
          h('input', {
            type:'text', value:tmpAnt,
            onChange: e => setTmpAnt(e.target.value),
            onKeyDown: e => e.key==='Enter' && lagre(),
          }),
        ),
      ),
      // Live preview
      preview && h('div', {style:{background:'var(--bg2)',borderRadius:5,padding:'8px 10px',marginBottom:8,fontSize:11}},
        h('div', {style:{color:'var(--txt4)',marginBottom:4,fontSize:10}}, 'Forhåndsvisning etter lagring:'),
        h('div', {style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'4px 12px'}},
          [
            ['Stop', preview.stop.toFixed(2)],
            ['Antall', preview.antall.toLocaleString('nb-NO')],
            ['Investering', preview.totInv.toLocaleString('nb-NO')],
            ['Target 2:1', preview.t2.toFixed(2)],
            ['Target 3:1', preview.t3.toFixed(2)],
            ['Target 4:1', preview.t4.toFixed(2)],
          ].map(([l,v]) => h('div', {key:l, style:{color:'var(--txt3)'}},
            h('span', {style:{color:'var(--txt4)',marginRight:4}}, l+':'),
            h('span', {style:{color:'var(--txt2)',fontFamily:'monospace'}}, v),
          ))
        ),
      ),
      h('div', {className:'edit-note'},
        'Endre inngang recalkulerer stop, targets og risiko-kr automatisk. \u00B7 Endre antall overstyrer posisjonst\u00F8rrelse direkte.'),
      h('div', {style:{display:'flex',gap:6}},
        h('button', {
          className:'btn', style:{padding:'6px 16px',fontSize:11},
          onClick:lagre, disabled:!innOK,
        }, 'Lagre'),
        h('button', {className:'btn-ghost', onClick:avbryt}, 'Avbryt'),
      ),
    ),

    // ── Rader: inngang / stop / targets ──
    h('div',{className:'target-row'},
      h('span',{style:{color:'var(--txt3)',minWidth:90,fontSize:11}},'Inngang'),
      h('span',{style:{fontWeight:700,color:'var(--txt)',fontFamily:'monospace'}},p.inngang.toFixed(2)),
      h('span',{style:{fontSize:10,color:'var(--txt4)',marginLeft:'auto'}},
        p.antall + ' stk \u00B7 ' + p.totInv.toLocaleString('nb-NO')),
    ),
    h('div',{className:'target-row'},
      h('span',{style:{color:'#f87171',minWidth:90,fontSize:11}},'Stop \u2212'+p.sPst+'%'),
      h('span',{style:{color:'#f87171',fontFamily:'monospace'}},p.stop.toFixed(2)),
      h('span',{style:{fontSize:10,color:'var(--txt4)',marginLeft:'auto'}},
        'risiko '+p.riskKr.toLocaleString('nb-NO')),
      h('span',{className:p.hitStop?'tgt-hit':'tgt-open',onClick:()=>onToggle(p.id,'hitStop')},
        p.hitStop?'STOPET':'aktiv'),
    ),
    [['t2','2:1'],['t3','3:1'],['t4','4:1']].map(([f,lbl])=>
      h('div',{key:f,className:'target-row'},
        h('span',{style:{color:'#22c55e',minWidth:90,fontSize:11}},'Target '+lbl),
        h('span',{style:{color:'#22c55e',fontFamily:'monospace'}},p[f].toFixed(2)),

// ─── Posisjoner-side ──────────────────────────────────────────────────────────
function Posisjoner() {
  const [pos, setPos] = useState(() => LS.get('posisjoner', []));

  const toggle = (id, f) => {
    const u = pos.map(p => p.id===id ? {...p,[f]:!p[f]} : p);
    setPos(u); LS.set('posisjoner', u);
  };
  const fjern = id => {
    if (!confirm('Fjerne posisjon?')) return;
    const u = pos.filter(p => p.id !== id);
    setPos(u); LS.set('posisjoner', u);
  };
  const oppdater = (id, nyInngang, nyAntall) => {
    const u = pos.map(p => p.id===id ? beregnPos(p, nyInngang, nyAntall) : p);
    setPos(u); LS.set('posisjoner', u);
  };

  if (!pos.length) return h('div',{style:{textAlign:'center',padding:40,color:'var(--txt4)'}},
    h('div',{style:{fontSize:28,marginBottom:10}},'\uD83D\uDCCB'),
    h('div',{style:{fontSize:13}},'Ingen registrerte posisjoner enn\u00E5.'),
    h('div',{style:{fontSize:11,color:'var(--txt4)',marginTop:6}},'Bruk "Kalk"-knappen og trykk "Registrer kj\u00F8p"'),
  );

  return h('div', null,
    h('div',{style:{fontSize:11,color:'var(--txt4)',marginBottom:14}},
      pos.length + ' posisjoner \u00B7 Klikk target for \u00E5 markere \u00B7 \u270F\uFE0F Juster for \u00E5 endre inngang og antall'),
    pos.map(p => h(PosKort,{key:p.id,p,onToggle:toggle,onFjern:fjern,onOppdater:oppdater})),
  );
}

  const [ok,setOk]=useState(null);
  const [minScore,setMinScore]=useState(7);
  const [sortBy,setSortBy]=useState('total');
  const [kalkAksje,setKalkAksje]=useState(null);
  const [openTicker,setOpenTicker]=useState(null);
  const autoRef=useRef(false);

  useEffect(()=>{document.body.className=dark?'':'light';},[dark]);
  useEffect(()=>{LS.set('dark',dark);},[dark]);

  useEffect(()=>{

  },[]);

  const doLoad=async(borsId,url,stille)=>{
    if(!url)return;
    if(!stille){setLoading(true);setError(null);setOk(null);}
    setLoadingBors(borsId);
    try{
      const res=await fetch(url);
      if(!res.ok)throw new Error('HTTP '+res.status);
      const json=await res.json();
      const rows=parseRows(Array.isArray(json)?json:[]);
      if(!rows.length)throw new Error('Ingen data returnert');
      setAllData(prev=>{const u={...prev,[borsId]:rows};LS.set('cached_data',u);return u;});
      if(!stille)setOk('\u2713 '+rows.length+' aksjer lastet fra '+borsId+' \u00B7 '+new Date().toLocaleTimeString('nb-NO'));
    }catch(e){if(!stille)setError(borsId+': '+e.message);}
    setLoadingBors(null);if(!stille)setLoading(false);

  const lastAlle=()=>EXCHANGES.forEach(ex=>{const u=LS.get('webapp_urls',{})[ex.id];if(u)doLoad(ex.id,u,false);});

  },[allData,aktivBors]);

  useEffect(()=>{setOpenTicker(null);},[sortBy,aktivBors,minScore]);

  const filtered=useMemo(()=>{
    const rsVal=(x)=>x.rsScore!=null?x.rsScore:0;
    const vcpVal=(x)=>x.vcpScore!=null?x.vcpScore:-1;
    const cmp=(a,b)=>{
      let d;
      if(sortBy==='total'){d=b.total-a.total;if(d!==0)return d;d=rsVal(b)-rsVal(a);if(d!==0)return d;return vcpVal(b)-vcpVal(a);}
      if(sortBy==='tt'){d=b.ttScore-a.ttScore;if(d!==0)return d;d=b.total-a.total;if(d!==0)return d;return rsVal(b)-rsVal(a);}

      return a.ticker.localeCompare(b.ticker);

            h('button',{className:'btn-ghost',disabled:!urls[ex.id],onClick:()=>doLoad(ex.id,urls[ex.id])},loadingBors===ex.id?'Laster\u2026':'Test')),
          (allData[ex.id]||[]).length>0&&h('div',{style:{fontSize:11,color:'#22c55e',marginTop:3}},'\u2713 '+(allData[ex.id]||[]).length+' aksjer cachet'))),
        error&&h('div',{className:'err'},'\u26A0 '+error),
        ok&&h('div',{className:'ok'},ok),
        h('button',{className:'btn',onClick:()=>{saveUrls();lastAlle();}},loading?'Laster\u2026':'Lagre og oppdater alle')),

      activeTab==='posisjoner'&&h(Posisjoner,null),

      activeTab==='ordliste'&&h('div',null,
        h('div',{style:{fontSize:14,fontWeight:700,color:'var(--txt)',marginBottom:14}},'Minervini-ordliste'),
        h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:12}},
          GLOSS.map(({t,c})=>h('div',{key:t,className:'guide-card'},h('div',{className:'g-title'},t),h('div',{className:'g-text'},c)))))),

      activeTab==='smc'&&h('div',null,
        h('div',{style:{fontSize:14,fontWeight:700,color:'var(--txt)',marginBottom:4}},'Smart Money Concepts \u2014 ordliste'),
        h('div',{style:{fontSize:11,color:'var(--txt3)',marginBottom:18,lineHeight:1.7,maxWidth:640}},
          'Engelske begreper som brukes i SMC-indikatorer (bl.a. LuxAlgo sin "Smart Money Concepts"), med norske forklaringer. Tenkt som referanse n\u00E5r du leser signaler i TradingView og vurderer entry/exit rundt VCP-kandidater fra screeneren.'),
        SMC_GLOSS.map(({g,items})=>h('div',{key:g,style:{marginBottom:22}},
          h('div',{className:'sec-lbl',style:{marginBottom:10,fontSize:10}},g),
          h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:12}},
            items.map(({t,c})=>h('div',{key:t,className:'guide-card'},h('div',{className:'g-title'},t),h('div',{className:'g-text'},c))))))),

      activeTab==='strategi'&&h('div',{style:{maxWidth:820}},
        h('div',{style:{fontSize:14,fontWeight:700,color:'var(--txt)',marginBottom:4}},'Strategi \u2014 SMC-basert VCP-rotasjon'),
        h('div',{style:{fontSize:11,color:'var(--txt3)',marginBottom:20,lineHeight:1.7}},
          'M\u00E5l: bytte fra \u00E5 jage store, langsomme gevinster til hyppigere trades med strukturbasert exit. Screeneren brukes som univers-filter (kvalitetsselskaper i trend); SMC-signaler styrer n\u00E5r du faktisk g\u00E5r inn og ut. Status: under utpr\u00F8ving \u2014 juster reglene etter hvert som du tester.'),
        h('div',{className:'sec-lbl',style:{marginBottom:10,fontSize:10}},'Steg for steg'),
        h('div',{style:{display:'flex',flexDirection:'column',gap:10,marginBottom:24}},
          STRATEGI_STEG.map(({n,t,c})=>h('div',{key:n,className:'guide-card',style:{display:'flex',gap:12,alignItems:'flex-start'}},
            h('div',{style:{minWidth:26,height:26,borderRadius:'50%',background:'var(--acc-bg)',border:'1px solid var(--acc)',
                     color:'var(--acc)',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},n),
            h('div',null,h('div',{className:'g-title',style:{marginBottom:3}},t),h('div',{className:'g-text'},c))))),
        h('div',{className:'sec-lbl',style:{marginBottom:10,fontSize:10}},'Kjente svakheter \u00E5 f\u00F8lge med p\u00E5 (VCP-indikator)'),
        h('div',{style:{display:'flex',flexDirection:'column',gap:10,marginBottom:24}},
          STRATEGI_FALLGRUVER.map(({t,c})=>h('div',{key:t,className:'guide-card',
            style:{borderColor:'rgba(239,68,68,.3)',background:'rgba(239,68,68,.04)'}},
            h('div',{className:'g-title',style:{color:'#f87171',marginBottom:3}},t),h('div',{className:'g-text'},c)))),
        h('div',{className:'sec-lbl',style:{marginBottom:10,fontSize:10}},'Logg per trade (for evaluering senere)'),
        h('div',{className:'guide-card'},
          h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:'6px 16px'}},
            STRATEGI_LOGG.map(item=>h('div',{key:item,style:{fontSize:11,color:'var(--txt3)',display:'flex',gap:6,alignItems:'flex-start'}},
              h('span',{style:{color:'var(--acc)'}},'\u2022'),item))))),

    kalkAksje&&h(Kalkulator,{aksje:kalkAksje,onClose:()=>setKalkAksje(null),onKjopt:()=>setActiveTab('posisjoner')}));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
</body>
</html>
